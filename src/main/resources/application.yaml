spring:
  application:
    name: helpdesk-api

  datasource:
    url: jdbc:mysql://localhost:3306/helpdesk?useSSL=false&serverTimezone=UTC
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  security:
    jwt:
      secret: ${SECRET_KEY}
      expiration: 3600000

  mail:
    host: ${EMAIL_HOST}
    port: ${EMAIL_PORT}
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  mail:
    from: no-reply@helpdesk.test
  base-url: http://localhost:8080